global
    maxconn 200

defaults
    mode tcp
    retries 2
    timeout client 30m
    timeout connect 4s
    timeout server 30m
    timeout check 5s

listen stats
    mode http
    bind *:7000
    stats enable
    stats uri /
    stats refresh 5s

listen postgres_write
    bind *:5432
    option tcp-check
    tcp-check connect port 5432
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
    server db-node1 db-node1:5432 check port 5432

listen postgres_read
    bind *:5433
    balance roundrobin
    option pgsql-check user monitorizacion
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
    server db-node1 db-node1:5432 check port 5432
    server db-node2 db-node2:5432 check port 5432
    server db-node3 db-node3:5432 check port 5432
